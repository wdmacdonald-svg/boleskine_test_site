name: Update Fixtures

on:
  workflow_dispatch:

jobs:
  fetch-fixtures:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl

      - name: Fetch fixtures
        run: php fetch-shinty-fixtures.php

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fixtures.js
          git diff --cached --quiet || git commit -m "Update fixtures.js [skip ci]" && git push

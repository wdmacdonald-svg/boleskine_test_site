name: Update Fixtures

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      test_team:
        description: 'Team name to test (leave blank for Boleskine)'
        required: false
        default: ''
  schedule:
    # Weekdays: once at 08:00 BST (07:00 UTC)
    - cron: '0 7 * * 1-5'
    # Thursday & Friday extra check: 18:00 BST (17:00 UTC)
    - cron: '0 17 * * 4,5'
    # Saturday extra early check: 08:00 BST (07:00 UTC)
    - cron: '0 7 * * 6'
    # Saturdays: every 20 mins from 14:00-23:00 BST (matches 15:00-23:59 BST kickoffs)
    - cron: '*/20 14-23 * * 6'
    # Sundays: every 20 mins from 00:00-11:00 BST
    - cron: '*/20 0-11 * * 0'

jobs:
  fetch-fixtures:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl

      - name: Fetch fixtures
        run: php fetch-shinty-fixtures.php
        env:
          TEST_TEAM: ${{ github.event.inputs.test_team }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index_files/fixtures.js
          git diff --cached --quiet || git commit -m "Update fixtures.js [skip ci]" && git push
